<canvas id="board" width="300" height="300"></canvas>
<div id="score">0</div>
<script>
"use strict";
var S = { snake: [{ x: 5, y: 5 }], food: { x: 8, y: 5 }, dir: "right", score: 0, mode: "playing" };
function onTick() {
  var head = S.snake[0];
  var nx = S.dir === "right" ? head.x + 1 : S.dir === "left" ? head.x - 1 : head.x;
  var ny = S.dir === "down" ? head.y + 1 : S.dir === "up" ? head.y - 1 : head.y;
  if (nx === S.food.x && ny === S.food.y) { S.score = S.score + 1; S.food = { x: 8, y: 8 }; }
  head.x = nx; head.y = ny;
}
function onTurn(e) {
  if (e.key === "ArrowRight") S.dir = "right"; else if (e.key === "ArrowLeft") S.dir = "left"; else if (e.key === "ArrowUp") S.dir = "up"; else if (e.key === "ArrowDown") S.dir = "down";
}
function render() {
  var c = document.getElementById("board");
  var x = c.getContext("2d");
  x.fillStyle = "#070";
  x.clearRect(0, 0, c.width, c.height);
  for (var i = 0; i < S.snake.length; i++) x.fillRect(S.snake[i].x * 10, S.snake[i].y * 10, 10, 10);
  x.fillStyle = "#f00"; x.fillRect(S.food.x * 10, S.food.y * 10, 10, 10);
  document.getElementById("score").textContent = String(S.score);
}

  var im = __pics[src];
  if (!im) { im = new Image(); im.onload = function () { __last = ""; __go(); }; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src); __pics[src] = im; }
  return im.complete && im.naturalWidth ? im : null;
}
var __last = "", __queued = false, __at = 0;
function __go() {
  var draw = function () { __queued = false; __last = ""; try { render(); } catch (err) { console.error(err); } };
  draw();
}
(function () { var c = document.getElementById("board"); if (c) { c.width = c.clientWidth || c.width; c.height = c.clientHeight || c.height; } })();
Array.prototype.forEach.call(document.querySelectorAll('[id= ' + JSON.stringify("board") + ']'), function (el) { el.addEventListener("click", function (e) { __run(onTurn, e); __go(); }); });

document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") { e.preventDefault(); __run(onTurn, e); __go(); } });
document.addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") { e.preventDefault(); __run(onTurn, e); __go(); } });
document.addEventListener("keydown", function (e) { if (e.key === "ArrowUp") { e.preventDefault(); __run(onTurn, e); __go(); } });
document.addEventListener("keydown", function (e) { if (e.key === "ArrowDown") { e.preventDefault(); __run(onTurn, e); __go(); } });
setInterval(function () { __run(onTick); __go(); }, 80);
__go();
</script>
